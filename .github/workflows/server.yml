name: server
on:
  push:
    paths: ["server/**","shared/**"]
  pull_request:
    paths: ["server/**","shared/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: server
